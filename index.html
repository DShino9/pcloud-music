<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音楽棚</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="音楽棚">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --dim2:#6a6a7a;
  --bg:#101014; --bg2:#17171d; --line:#26262f; --fg:#ececf1; --dim:#8b8b99;
  --accent:#6ea8fe; --warn:#e5a34a; --ok:#5fbf7f; --danger:#e06c75;
  --bar:68px; --hdr:44px; --top:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.hide{display:none !important}

/* ---- header ---- */
header{
  position:fixed; left:0; right:0; top:var(--top); z-index:46;
  height:var(--hdr); background:rgba(16,16,20,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:0 12px; display:flex; align-items:center; gap:9px;
}
header h1{font-size:15.5px;margin:0;font-weight:600;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hbtn{padding:5px 9px;font-size:12.5px}
.hbtn{padding:7px 11px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.hbtn:active{background:#22222b}
.hbtn.on{border-color:var(--accent);color:var(--accent)}

main{padding:calc(var(--top) + var(--hdr) + 12px) 14px calc(var(--safe-b) + 30px)}

/* ---- login / setup ---- */
.card{max-width:420px;margin:8vh auto;padding:22px;background:var(--bg2);
  border:1px solid var(--line);border-radius:16px}
.card h2{margin:0 0 6px;font-size:19px}
.card p{color:var(--dim);font-size:13px;margin:0 0 16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.field input{width:100%;padding:11px 12px;border-radius:10px;background:#0c0c10;
  border:1px solid var(--line);color:var(--fg)}
.field input:focus{outline:none;border-color:var(--accent)}
.primary{width:100%;padding:12px;border-radius:10px;background:var(--accent);
  color:#0b0b0f;font-weight:600;margin-top:6px}
.primary:disabled{opacity:.45}
.msg{font-size:13px;margin-top:12px;min-height:19px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
.note{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.6}

/* ---- folder picker ---- */
.rowlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:#22222b}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--dim)}
.crumb{font-size:13px;color:var(--dim);margin-bottom:10px;word-break:break-all}

/* ---- album grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,148px),1fr));gap:14px}
body[data-cell="s"]{--cell:104px} body[data-cell="m"]{--cell:148px} body[data-cell="l"]{--cell:220px}
body[data-cell="s"] .al .t{font-size:12px;-webkit-line-clamp:1}
body[data-cell="s"] .al .a{font-size:10.5px}
body[data-cell="s"] .cov .go{width:28px;height:28px;font-size:11px}
.al{text-align:left;width:100%}
.cov{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;
  background:linear-gradient(145deg,#22222b,#171720);border:1px solid var(--line)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#3a3a48}
.cov .made{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:10px;text-align:center;font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.86);
  font-weight:600;overflow:hidden;
  -webkit-line-clamp:5;-webkit-box-orient:vertical;letter-spacing:.01em}
.cov .go{position:absolute;right:7px;bottom:7px;width:36px;height:36px;border-radius:50%;
  background:rgba(12,12,16,.72);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);
  color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;
  padding-left:2px;opacity:.92}
.cov .go:active{background:var(--accent);color:#0b0b0f}
.cov .badge{position:absolute;left:6px;bottom:6px;font-size:10px;padding:2px 6px;
  border-radius:6px;background:rgba(0,0,0,.7);color:var(--dim)}
.cov .badge.auto{color:var(--warn);border:1px solid rgba(229,163,74,.4);cursor:pointer}
.cov .badge.auto:active{background:var(--warn);color:#0b0b0f}
.cov .badge.off{color:var(--ok)}
.al .t{font-size:13px;margin-top:7px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.al .a{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- 絞り込みと並び替え ---- */
.libbar{position:sticky;top:calc(var(--top) + var(--hdr));z-index:14;
  background:var(--bg);padding:6px 0 5px;margin:-12px 0 6px}
body.playing .libbar{top:calc(var(--top) + var(--hdr) + var(--bar))}
/* 横に流せる1行に詰める。縦を食わせない。 */
.libbar .row1{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:3px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.libbar .row1::-webkit-scrollbar{display:none}
.libbar .row1 > *{flex:0 0 auto}
.libbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.libbar .hbtn{padding:5px 9px;font-size:12.5px;border-radius:8px}
.libbar select{padding:5px 22px 5px 9px;font-size:12.5px;border-radius:8px;width:auto;flex:0 0 auto;
  max-width:38vw;background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%}
.libbar .chips{margin:5px 0 0;gap:6px}
.libbar .chips .hbtn{padding:4px 9px;font-size:12px}
.libbar .srch{margin:5px 0 0}
.libbar .srch input{padding:8px 11px;font-size:14px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:11px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips .hbtn{flex:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools select{
  flex:1 1 auto;min-width:0;max-width:100%;padding:8px 10px;border-radius:9px;
  background:var(--bg2);border:1px solid var(--line);color:var(--fg);font-size:13px;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px;
}
.tools select:focus{outline:none;border-color:var(--accent)}
.tools .hbtn{flex:none}
.cov .badge.star{left:auto;right:6px;color:var(--warn);background:rgba(0,0,0,.65)}
.chk{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg)}
.chk.on{background:var(--accent);border-color:var(--accent);color:#0b0b0f}
.row .nm .sub{display:block;font-size:12px;color:var(--dim);margin-top:2px}

/* ---- track list ---- */
.tk{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tk .n{width:22px;text-align:right;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.tk .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.tk .d{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tk.playing .nm{color:var(--accent)}
.tk.cached .n::after{content:"↓";color:var(--ok);margin-left:2px}
.tk .hit{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:0}
.tk .star{width:34px;flex:none;color:var(--dim);font-size:15px}
.tk .star.on{color:var(--warn)}
.tk .nm .a{display:block}

.albumhead{display:flex;gap:14px;margin-bottom:16px}
.albumhead .cov{width:132px;flex:none;align-self:flex-start}
.albumhead .cov img{width:132px;height:132px;object-fit:cover;border-radius:8px;display:block}
.albumhead .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.albumhead h2{margin:0;font-size:17px;line-height:1.3}
.albumhead .a{color:var(--dim);font-size:13px}
.albumhead .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}

/* ---- cover picker ---- */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:11px;margin-top:12px}
.cand{position:relative;border-radius:9px;overflow:hidden;border:2px solid transparent;background:#0c0c10}
.cand img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cand.sel{border-color:var(--accent)}
.cand .cl{font-size:10.5px;color:var(--dim);padding:5px 6px 6px;line-height:1.35;min-height:44px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.drop{margin-top:10px;padding:18px 14px;border:1.5px dashed var(--line);border-radius:12px;
  text-align:center;color:var(--dim);font-size:13px;line-height:1.7;cursor:pointer;
  transition:border-color .12s,background .12s}
.drop.on{border-color:var(--accent);background:rgba(110,168,254,.08);color:var(--fg)}
.drop b{color:var(--fg);font-weight:600}
.drop .sub{font-size:11.5px;color:var(--dim2)}
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow input{flex:1;padding:10px 12px;border-radius:10px;background:#0c0c10;border:1px solid var(--line);color:var(--fg)}

/* ---- sweep progress ---- */
.sweep{position:sticky;z-index:15;margin:0 -14px 14px;padding:9px 14px;
  background:#1b1b24;border-bottom:1px solid var(--line);font-size:13px;
  display:flex;align-items:center;gap:10px}
.sweep .bar{flex:1;height:4px;border-radius:2px;background:#2c2c38;overflow:hidden}
.sweep .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* ---- 再生画面（全画面） ---- */
.now{position:fixed;inset:0;z-index:60;background:#0b0b0f;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.nowtop{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.nowinfo{flex:1;min-width:0;text-align:center}
.nowinfo .nt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowinfo .na{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowwrap{flex:1;min-height:0;display:flex;gap:12px}
.nowcv{flex:1;min-width:0;min-height:0;position:relative}
.now canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:12px;
  background:#0b0b0f;cursor:pointer;touch-action:manipulation}
.nowq{width:270px;flex:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-left:1px solid var(--line);padding-left:12px}
.nowq .qh{font-size:11.5px;color:var(--dim);margin:2px 0 8px;position:sticky;top:0;
  background:#0b0b0f;padding-bottom:6px}
.nowq .qi{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:6px 0}
.nowq .qi:active{background:var(--bg2)}
.nowq .qi img{width:34px;height:34px;border-radius:5px;object-fit:cover;background:#22222b;flex:none}
.nowq .qt{flex:1;min-width:0}
.nowq .q1{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowq .q2{display:block;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowq .qe{color:var(--dim);font-size:12px;padding:8px 0}
@media (max-width:720px){
  .nowwrap{flex-direction:column}
  /* 絵は正方形。縦長の枠に置くと上下が余り、そこが空白に見えていた。
     余ったぶんは次に流れる一覧に回す。 */
  .nowcv{flex:none;aspect-ratio:1;width:100%}
  .nowq{width:auto;flex:1;min-height:0;max-height:none;border-left:0;
    border-top:1px solid var(--line);padding-left:0;padding-top:8px}
}
.nowname{text-align:center;font-size:11.5px;color:var(--dim);padding:9px 0 7px}
.nowbar{height:3px;border-radius:2px;background:#2c2c38;overflow:hidden;margin-bottom:12px}
.nowbar i{display:block;height:100%;width:0;background:var(--accent)}
.nowctl{display:flex;align-items:center;justify-content:center;gap:14px}
.nowctl button{width:52px;height:52px;border-radius:50%;font-size:21px;
  display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line)}
.nowctl button:active{background:#2c2c38}
.nowctl .hbtn{width:auto;height:auto;border-radius:9px;font-size:13px;padding:9px 13px}
.now .msg{text-align:center;font-size:12.5px;color:var(--dim);min-height:0;margin-top:10px}
.now .msg b{color:var(--fg);font-weight:500}

.tri{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tcard{background:#15151b;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#22222b}
.tcard .tn{font-size:12.5px;font-weight:600;padding:6px 8px 0;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .ta{font-size:11px;color:var(--dim);padding:2px 8px 6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tcard .alt{display:flex;gap:5px;align-items:center;padding:0 8px 6px;min-height:26px;flex-wrap:wrap}
.tcard .alt .an{font-size:10.5px;color:var(--dim2,#6a6a7a);width:100%}
.tcard .alt img{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#22222b;
  border:1px solid var(--line);cursor:pointer}
.tcard .alt img:active{outline:2px solid var(--accent)}
.tcard .tb{display:flex;gap:6px;padding:0 8px 8px}
.tcard .tb button{flex:1;font-size:12px;padding:7px 0;border-radius:7px;border:1px solid var(--line);
  white-space:nowrap}
.tcard .ok{background:#1d3324;color:#8fe0a8}
.tcard .ng{background:#33201f;color:#e69a92}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 0 10px}
.tk .tg{display:block;font-size:11px;color:var(--dim2,#6a6a7a);margin-top:2px}
.albumhead .tchip{margin-top:4px}
.tagrow .tnote{font-size:11.5px;color:var(--dim);margin-right:4px}
.tchip{font-size:12.5px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);
  background:#15151b;color:var(--fg);display:flex;gap:5px;align-items:center}
.tchip b{color:var(--dim);font-weight:500;font-size:11px}
.tchip:active{background:#23232c}
/* リモコンやキーボードで動かすとき、どこに焦点があるか見えないと選べない */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.cell:focus-visible,.hit2:focus-visible,.strip:focus-visible{outline-offset:0}
.jb .strip:focus-visible{outline:3px solid #ffb03a}
/* ---- player bar ---- */
#player{
  position:fixed;left:0;right:0;top:calc(var(--top) + var(--hdr));z-index:45;
  background:rgba(23,23,29,.97);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:0 12px; height:var(--bar);
  display:flex;align-items:center;gap:10px;
}
/* 見出しと再生バーを積むが、合わせて 96px に収める */
body.playing main{padding-top:calc(var(--top) + var(--hdr) + var(--bar) + 12px)}
body.playing .sweep{top:calc(var(--top) + var(--hdr) + var(--bar))}
.sweep{top:calc(var(--top) + var(--hdr))}
#player .pc{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#22222b;flex:none}
#player .info{flex:1;min-width:0;cursor:pointer}
#player .nx{display:block;font-size:11px;color:var(--dim2,#6a6a7a);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .qbtn{flex:none;padding:7px 10px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg2);font-size:12px;color:var(--dim);white-space:nowrap}
#player .qbtn b{color:var(--fg);font-weight:600}
.volwrap{display:flex;align-items:center;gap:6px;flex:none}
.volwrap button{width:26px;height:26px;font-size:14px;color:var(--dim)}
#pvol{-webkit-appearance:none;appearance:none;width:78px;height:3px;border-radius:2px;
  background:#33333f;outline:none}
#pvol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--fg);cursor:pointer}
#pvol::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}
@media (max-width:760px){ .volwrap{display:none} }
/* 狭い画面では、右の部品に幅を取られて曲名が「サン…」まで潰れていた。
   次の曲は info の三行目に出ているので、札は要らない。 */
@media (max-width:520px){
  #player{padding:0 8px;gap:8px}
  #player .qbtn{display:none}
  #player .pc{width:46px;height:46px}
  #player .ti{font-size:14.5px}
  #player .ar,#player .nx{font-size:10.5px}
  #player .ctl button{width:38px;height:38px;font-size:16px}
  #player .ctl #pdots{width:24px}
}
@media (max-width:380px){
  #player .ctl button:first-child{display:none}   /* 前の曲は画面を開けば押せる */
}
/* 車モードと全画面の音量 */
.volbig{display:flex;align-items:center;gap:12px;margin-top:12px}
.volbig button{width:52px;height:52px;border-radius:14px;background:#15151b;border:1px solid #2c2c38;
  font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.volbig input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:4px;
  background:#2a2a33;outline:none}
.volbig input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;
  border-radius:50%;background:#6ea8fe;cursor:pointer}
#player .ti{font-size:15.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .ar{font-size:11.5px;line-height:1.25;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .ctl{display:flex;align-items:center;gap:1px}
#player .ctl #pdots{width:28px;font-size:16px;color:var(--dim)}
#player .ctl button{width:42px;height:42px;border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center}
#player .ctl button:active{background:#2c2c38}
#seekwrap{position:absolute;left:0;right:0;bottom:-1px;height:14px;touch-action:none;cursor:pointer}
#seekwrap::before{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:#2c2c38}
#seek{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.nowbar{touch-action:none;cursor:pointer}
.bar2{touch-action:none;cursor:pointer}
#player.gone{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 18px);z-index:60;
  background:#2c2c38;border:1px solid var(--line);padding:10px 16px;border-radius:11px;
  font-size:13px;max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:14px;line-height:1.8}

/* ---- 探す ---- */
.srch{display:flex;gap:8px;margin-bottom:14px}
.srch input{flex:1;padding:11px 13px;border-radius:11px;background:var(--bg2);
  border:1px solid var(--line);color:var(--fg);font-size:15px}
.srch input:focus{outline:none;border-color:var(--accent)}
.sect{color:var(--dim);font-size:12px;margin:18px 0 8px;letter-spacing:.04em}
.hit2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 2px;
  border-bottom:1px solid var(--line)}
.hit2 img{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#22222b;flex:none}
.hit2 .t2{flex:1;min-width:0}
.hit2 .t2 .n2{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit2 .t2 .a2{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- 車モード ---- */
.car{position:fixed;inset:0;z-index:50;background:#000;color:#fff;
  display:flex;flex-direction:column;padding:calc(var(--top) + 10px) 16px calc(var(--safe-b) + 16px)}
.car .top{display:flex;justify-content:space-between;align-items:center}
.car .top button{font-size:15px;padding:12px 16px;border-radius:12px;border:1px solid #333;background:#111}
.car .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 0}
.car .art img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain}
.car .ti2{font-size:clamp(22px,5.5vw,38px);font-weight:700;text-align:center;line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.car .ar2{font-size:clamp(14px,3vw,20px);color:#9a9aa6;text-align:center;margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car .bar2{height:6px;border-radius:3px;background:#2a2a33;margin:16px 0;overflow:hidden}
.car .bar2 i{display:block;height:100%;width:0;background:#6ea8fe}
.car .ctl2{display:flex;gap:14px}
.car .ctl2 button{flex:1;height:clamp(76px,13vh,110px);border-radius:18px;background:#15151b;
  border:1px solid #2c2c38;font-size:34px;display:flex;align-items:center;justify-content:center}
.car .ctl2 button:active{background:#2a2a38}
.car .ctl2 button.big{flex:1.6;background:#6ea8fe;color:#08080c}

/* ---- ジュークボックス ---- */
.jb{position:fixed;inset:0;z-index:48;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(120% 60% at 50% -8%, #3a1420 0%, transparent 58%),
    linear-gradient(180deg,#1a0d13 0%, #120a10 40%, #0a0709 100%);
  padding:calc(var(--top) + 10px) 14px calc(var(--safe-b) + 20px)}
.jb .cab{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  border:1px solid #4a2a36;border-radius:26px 26px 12px 12px;
  background:linear-gradient(180deg,#241019,#180c12);
  box-shadow:0 0 0 3px rgba(255,190,120,.10), 0 24px 60px rgba(0,0,0,.6);overflow:hidden}
/* 上のアーチと光る管 */
.jb .arch{height:86px;position:relative;
  background:linear-gradient(180deg,#3a1a26,#241019);
  border-bottom:1px solid #4a2a36;overflow:hidden}
.jb .arch .tube{position:absolute;left:6%;right:6%;top:26px;height:9px;border-radius:9px;
  background:linear-gradient(90deg,#ff7a3d,#ffd166,#7ce7c4,#6ea8fe,#c58bff,#ff7a3d);
  background-size:300% 100%;animation:jbflow 9s linear infinite;filter:blur(.3px);
  box-shadow:0 0 22px rgba(255,180,120,.55)}
.jb .arch .tube.b{top:46px;height:6px;opacity:.75;animation-direction:reverse}
@keyframes jbflow{to{background-position:300% 0}}
.jb .name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,"Hiragino Mincho ProN",serif;font-style:italic;font-size:27px;
  color:#ffdca8;text-shadow:0 0 18px rgba(255,180,110,.6),0 2px 0 rgba(0,0,0,.5);letter-spacing:.06em}
/* 選曲窓 */
.jb .knobs{display:flex;gap:26px;justify-content:center;margin:10px 0 2px}
.jb .kn{display:flex;flex-direction:column;align-items:center;gap:4px}
.jb .kn img{width:64px;height:64px;display:block;cursor:grab;touch-action:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));transition:transform .12s}
.jb .kn img:active{cursor:grabbing}
.jb .kn span{font-size:11px;color:#c69b86}
.jb .brassrow{display:flex;gap:8px;align-items:center;margin:0 12px;padding:9px 12px;
  border-radius:0 0 12px 12px;border:1px solid #4a3120;border-top:0;
  background:linear-gradient(180deg,#c9a35e,#a37f42 55%,#8a6a36);
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.jb .brassrow select{flex:1;min-width:0;font-size:12.5px;padding:6px 24px 6px 9px;border-radius:7px;
  background:#2a1c10;color:#f0dcc0;border:1px solid #6b4c26}
.jb .brassrow .cnt{font-size:11.5px;color:#3a2a12;font-weight:600;flex:none}
.jb .brassrow .hbtn{flex:none;font-size:12px;padding:5px 9px;background:#2a1c10;color:#f0dcc0;
  border:1px solid #6b4c26}
.jb .panel{margin:10px 12px 0;border-radius:12px;overflow:hidden;
  border:1px solid #4a3120;box-shadow:0 6px 22px rgba(0,0,0,.6)}
.jb .panel{border-radius:12px 12px 0 0;border-bottom:0}
.jb .panel canvas{width:100%;height:min(46vh,380px);display:block}
@media (max-width:520px){ .jb .panel canvas{height:min(46vh,340px)} }
.jb .strip .sc{width:38px;height:38px;object-fit:cover;flex:none;align-self:center;margin-left:6px;
  border-radius:3px;background:#241019}
.jb .win{margin:14px;padding:12px;border-radius:10px;
  background:linear-gradient(180deg,#0d0c10,#141218);border:1px solid #3a2430;
  box-shadow:inset 0 2px 14px rgba(0,0,0,.7)}
.jb .now2{display:flex;gap:12px;align-items:center;padding:6px 6px 12px;border-bottom:1px solid #2c1c26}
.jb .now2 img{width:64px;height:64px;border-radius:4px;object-fit:cover;background:#241019;flex:none;
  box-shadow:0 3px 12px rgba(0,0,0,.6)}
.jb .now2 .t3{flex:1;min-width:0;font-family:Georgia,serif}
.jb .now2 .n3{font-size:17px;color:#ffe6c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb .now2 .a3{font-size:12.5px;color:#c69b86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb .win{flex:1}
/* ジュークの中で選ぶところ。筐体の中なので、棚の帯とは別の見た目にする。 */
.jb .pickrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.jb .pickrow select{padding:7px 26px 7px 10px;border-radius:4px;font-size:13px;
  background:#1a1712;color:#f3e3c0;border:1px solid #6b573a;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.jb .pickrow select:focus{outline:none;border-color:#ffb03a}
.jb .pickrow .cnt{font-size:12px;color:#c8b48c;letter-spacing:.04em}
.jb .pickrow .hbtn{padding:6px 11px;font-size:12.5px;border-radius:4px;
  background:#1a1712;color:#f3e3c0;border:1px solid #6b573a}
.jb .pickrow .hbtn:active{background:#2a2419}
.jb .rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px;margin-top:12px}
/* 曲目札：本物の title strip に寄せる */
.jb .strip{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;
  background:linear-gradient(180deg,#fdf6e6,#efe2c8);border:1px solid #b9a887;border-radius:3px;
  overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.jb .strip .code{flex:none;width:46px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#b8202f,#8d1622);color:#ffe9c9;font:700 15px/1 "Barlow Condensed",sans-serif;
  letter-spacing:.06em}
.jb .strip .txt{flex:1;min-width:0;padding:7px 9px}
.jb .strip .s1{font:600 13.5px/1.25 Georgia,"Hiragino Mincho ProN",serif;color:#241a12;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb .strip .s2{font:11px/1.3 Georgia,serif;color:#7a6650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb .strip:active{filter:brightness(1.08)}
.jb .strip.on{outline:2px solid #ffb03a;outline-offset:1px}
/* 下の操作 */
.jb .keys{display:flex;gap:10px;justify-content:center;padding:14px;flex-wrap:wrap}
.jb .keys button{min-width:64px;height:52px;border-radius:8px;color:#ffe6c0;font-size:17px;
  background:linear-gradient(180deg,#3a2029,#251319);border:1px solid #5a3341;
  box-shadow:0 3px 0 #140b0f, inset 0 1px 0 rgba(255,255,255,.10)}
.jb .keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #140b0f}
.jb .keys button.wide{min-width:112px;font-size:14px}
.jb .foot{text-align:center;color:#8d6d5c;font-size:11.5px;padding:0 14px 14px}

/* ---- 操作シート（YouTube Music の ⋮ に相当） ---- */
.sheetbg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);
  opacity:0;transition:opacity .16s;backdrop-filter:blur(2px)}
.sheetbg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;
  background:var(--bg2);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:8px 0 calc(var(--safe-b) + 10px);
  transform:translateY(100%);transition:transform .2s cubic-bezier(.2,.8,.2,1);
  max-height:78vh;overflow:auto}
.sheet.on{transform:none}
.sheet .grip{width:38px;height:4px;border-radius:2px;background:#3a3a48;margin:6px auto 12px}
.sheet .head{display:flex;gap:12px;align-items:center;padding:0 18px 12px;border-bottom:1px solid var(--line)}
.sheet .head img{width:46px;height:46px;border-radius:7px;object-fit:cover;background:#22222b;flex:none}
.sheet .head .t{flex:1;min-width:0}
.sheet .head .t .a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .head .t .n{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet button.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 18px;font-size:14.5px}
.sheet button.item:active{background:var(--bg3,#22222b)}
.sheet button.item .ic{width:22px;text-align:center;font-size:16px;color:var(--dim);flex:none}
.dots{width:34px;flex:none;color:var(--dim);font-size:17px;line-height:1}
.cov .dots{position:absolute;right:5px;top:3px;width:28px;height:28px;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.9);opacity:.85}
</style>
</head>
<body>

<header id="hdr" class="hide">
  <button class="hbtn" id="back">‹</button>
  <h1 id="title">音楽棚</h1>
  <button class="hbtn" id="btnSearch" aria-label="探す">🔍</button>
  <button class="hbtn" id="btnCovers">ジャケット</button>
  <button class="hbtn" id="btnMenu">⋯</button>
</header>

<main id="main"></main>

<div id="player" class="gone">
  <div id="seekwrap"><div id="seek"></div></div>
  <img class="pc" id="pcov" alt="">
  <div class="info" id="pinfo"><div class="ti" id="pti">—</div><div class="ar" id="par"></div>
    <div class="nx" id="pnx"></div></div>
  <button class="qbtn" id="pq">次 <b id="pqn">0</b></button>
  <div class="ctl">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>
    <button id="pdots" aria-label="操作">⋮</button>
  </div>
  <div class="volwrap">
    <button id="pmute" aria-label="消音">🔊</button>
    <input id="pvol" type="range" min="0" max="100" step="1" value="100" aria-label="音量">
  </div>
</div>

<div class="sheetbg hide" id="sheetbg"></div>
<div class="sheet hide" id="sheet"></div>
<div class="toast" id="toast"></div>
<audio id="au" preload="none"></audio>

<script src="./app.js?v=118"></script>
</body>
</html>
